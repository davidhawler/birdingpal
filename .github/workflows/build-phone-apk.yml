name: Build BirdingPal phone APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply phone-only overlay
        run: python3 phone-build/apply_phone_only.py .

      - name: Configure phone build
        working-directory: android
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BIRDNET_ANALYZER_URL: ${{ secrets.BIRDNET_ANALYZER_URL }}
        run: |
          {
            echo "OPENAI_API_KEY=$OPENAI_API_KEY"
            echo "BIRDNET_ANALYZER_URL=$BIRDNET_ANALYZER_URL"
            echo "ENABLE_BLE=false"
          } > local.properties

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: birdingpal-phone-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
